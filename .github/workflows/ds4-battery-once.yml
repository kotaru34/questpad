name: ds4-battery-once

on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Run DS4 battery telemetry patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
          fetch-depth: 0
      - name: Apply DS4 battery patch
        run: python scripts/ds4_battery_patch.py
      - name: Remove one-shot files
        run: rm scripts/ds4_battery_patch.py .github/workflows/ds4-battery-once.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Report controller battery through virtual DS4"
          git push origin HEAD:agent/session-polish
