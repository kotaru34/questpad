name: imu-0.4.1-once

on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Apply 0.4.1 DS4 accelerometer compatibility')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
          fetch-depth: 0
      - name: Patch gravity accelerometer compatibility
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n} for {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Quest side: keep the existing inverse-locate angular-rate calculation exactly
          # as-is, but also expose the orientation from that same xrLocateSpace result.
          # inverseLocation is LOCAL-in-controller; conjugating it restores the existing
          # packet semantic controller-in-LOCAL used by tracked-pose mode.
          rep('quest/src/main/cpp/questpad.cpp',
              '''void locateAngularOnly(XrSpace controllerSpace, XrSpace localSpace, XrTime time, bool active, bool left, MotionOutput& out) {
    const uint32_t activeBit = left ? MOTION_LEFT_ACTIVE : MOTION_RIGHT_ACTIVE;
    const uint32_t avBit = left ? MOTION_LEFT_AV : MOTION_RIGHT_AV;
    if (!active) return;
    out.flags |= activeBit;
    XrSpaceVelocity velocity{XR_TYPE_SPACE_VELOCITY};
    XrSpaceLocation location{XR_TYPE_SPACE_LOCATION};
    location.next = &velocity;
    if (XR_SUCCEEDED(xrLocateSpace(localSpace, controllerSpace, time, &location)) &&
        (velocity.velocityFlags & XR_SPACE_VELOCITY_ANGULAR_VALID_BIT)) {
        out.flags |= avBit;
        out.angularLocal = {-velocity.angularVelocity.x, -velocity.angularVelocity.y, -velocity.angularVelocity.z};
    }
}
''',
              '''void locateAngularOnly(XrSpace controllerSpace, XrSpace localSpace, XrTime time, bool active, bool left, MotionOutput& out) {
    const uint32_t activeBit = left ? MOTION_LEFT_ACTIVE : MOTION_RIGHT_ACTIVE;
    const uint32_t ovBit = left ? MOTION_LEFT_OV : MOTION_RIGHT_OV;
    const uint32_t otBit = left ? MOTION_LEFT_OT : MOTION_RIGHT_OT;
    const uint32_t avBit = left ? MOTION_LEFT_AV : MOTION_RIGHT_AV;
    if (!active) return;
    out.flags |= activeBit;

    // Keep the established angular-rate path untouched: locating LOCAL relative to
    // the controller yields angular velocity in controller-local axes, and negating
    // it gives controller motion relative to LOCAL. The same locate result also
    // contains LOCAL-in-controller orientation. Conjugate that quaternion to publish
    // controller-in-LOCAL through the packet's existing orientation fields. This adds
    // no second xrLocateSpace call and does not involve positional tracking.
    XrSpaceVelocity velocity{XR_TYPE_SPACE_VELOCITY};
    XrSpaceLocation location{XR_TYPE_SPACE_LOCATION};
    location.next = &velocity;
    if (XR_FAILED(xrLocateSpace(localSpace, controllerSpace, time, &location))) return;

    if (location.locationFlags & XR_SPACE_LOCATION_ORIENTATION_VALID_BIT) {
        out.flags |= ovBit;
        out.orientation = {
            -location.pose.orientation.x,
            -location.pose.orientation.y,
            -location.pose.orientation.z,
             location.pose.orientation.w};
    }
    if (location.locationFlags & XR_SPACE_LOCATION_ORIENTATION_TRACKED_BIT)
        out.flags |= otBit;

    if (velocity.velocityFlags & XR_SPACE_VELOCITY_ANGULAR_VALID_BIT) {
        out.flags |= avBit;
        out.angularLocal = {-velocity.angularVelocity.x, -velocity.angularVelocity.y, -velocity.angularVelocity.z};
    }
}
''')

          rep('quest/src/main/cpp/questpad.cpp',
              '    ici.applicationInfo.applicationVersion = 6;\n',
              '    ici.applicationInfo.applicationVersion = 7;\n')

          # Host motion model: acceleration is deliberately independent from gyro
          # validity/filtering so right-stick gyro lock cannot zero the gravity channel.
          rep('host/InputModels.cs',
              '''internal readonly record struct ProcessedMotion(
    bool GyroValid,
    Vector3 GyroRadiansPerSecond,
    bool SteeringValid,
    float SteeringNormalized,
    string SteeringState);
''',
              '''internal readonly record struct ProcessedMotion(
    bool GyroValid,
    Vector3 GyroRadiansPerSecond,
    bool AccelerationValid,
    Vector3 AccelerationG,
    bool SteeringValid,
    float SteeringNormalized,
    string SteeringState);
''')

          rep('host/MotionProcessing.cs',
              '''        Vector3 gyro = Vector3.Zero;
        bool gyroValid = false;

        if (settings.GyroSource == GyroSourceMode.AngularRate)
''',
              '''        // DS4 compatibility accelerometer: OpenXR exposes orientation and
        // velocity but no raw Touch Plus accelerometer. A stationary accelerometer
        // measures specific force opposite gravity, so rotate LOCAL +Y (1 g) into
        // controller-local axes. This is intentionally gravity-only: no finite-
        // difference linear acceleration, no extra pose query, and no filtering path
        // shared with gyro. It therefore cannot add noise to the angular-rate signal.
        Vector3 accelerationG = Vector3.Zero;
        bool accelerationValid = false;
        if (frame.Right.Active && frame.Right.OrientationValid)
        {
            Quaternion rawOrientation = frame.Right.Orientation;
            float orientationNorm = rawOrientation.LengthSquared();
            if (orientationNorm > 1e-10f && float.IsFinite(orientationNorm))
            {
                Quaternion q = Quaternion.Normalize(rawOrientation);
                accelerationG = Vector3.Transform(Vector3.UnitY, Quaternion.Conjugate(q));
                accelerationValid = IsFinite(accelerationG);
            }
        }

        Vector3 gyro = Vector3.Zero;
        bool gyroValid = false;

        if (settings.GyroSource == GyroSourceMode.AngularRate)
''')

          rep('host/MotionProcessing.cs',
              '''        return new ProcessedMotion(gyroValid, gyro, steeringValid, steeringValue, steeringState);
''',
              '''        return new ProcessedMotion(
            gyroValid,
            gyro,
            accelerationValid,
            accelerationG,
            steeringValid,
            steeringValue,
            steeringState);
''')

          rep('host/OutputBackends.cs',
              '''    private const float GyroCountsPerDegreeSecond = 16.0f;
''',
              '''    private const float GyroCountsPerDegreeSecond = 16.0f;
    private const float AccelCountsPerG = 8192.0f;
''')

          rep('host/OutputBackends.cs',
              '''        // Acceleration remains zero on purpose: QuestPad's native gyro feature only
        // promises rotation-rate data and does not fabricate an accelerometer.
        pad.SubmitRawReport(report);
''',
              '''        if (motion.AccelerationValid)
        {
            // DS4 raw accelerometer fields are signed 16-bit values at 8192 counts/g.
            // QuestPad supplies only the gravity/specific-force component derived from
            // the right Touch orientation; translational acceleration is intentionally
            // not fabricated from noisy finite differences.
            BinaryPrimitives.WriteInt16LittleEndian(report.AsSpan(18, 2), AccelRaw(motion.AccelerationG.X));
            BinaryPrimitives.WriteInt16LittleEndian(report.AsSpan(20, 2), AccelRaw(motion.AccelerationG.Y));
            BinaryPrimitives.WriteInt16LittleEndian(report.AsSpan(22, 2), AccelRaw(motion.AccelerationG.Z));
        }

        pad.SubmitRawReport(report);
''')

          rep('host/OutputBackends.cs',
              '''    private static short GyroRaw(float degreesPerSecond)
    {
        double raw = degreesPerSecond * GyroCountsPerDegreeSecond;
        return (short)Math.Clamp(Math.Round(raw), short.MinValue, short.MaxValue);
    }

''',
              '''    private static short GyroRaw(float degreesPerSecond)
    {
        double raw = degreesPerSecond * GyroCountsPerDegreeSecond;
        return (short)Math.Clamp(Math.Round(raw), short.MinValue, short.MaxValue);
    }

    private static short AccelRaw(float g)
    {
        double raw = g * AccelCountsPerG;
        return (short)Math.Clamp(Math.Round(raw), short.MinValue, short.MaxValue);
    }

''')

          # Version both sides because the Quest APK now changes too.
          for project in ('host/QuestPad.Host.csproj', 'host/QuestPad.Host.Console.csproj'):
              rep(project, '<Version>0.4.0-test</Version>', '<Version>0.4.1-test</Version>')
              rep(project, '<FileVersion>0.4.0.0</FileVersion>', '<FileVersion>0.4.1.0</FileVersion>')

          rep('quest/build.gradle', "        versionCode 9\n        versionName '0.3.7-test'\n",
                                   "        versionCode 10\n        versionName '0.4.1-test'\n")

          # Permanent deterministic regression test. It verifies that gravity synthesis
          # works and, critically, that the established angular-rate vector is unchanged.
          Path('tests/MotionSmoke').mkdir(parents=True, exist_ok=True)
          Path('tests/MotionSmoke/MotionSmoke.csproj').write_text('''<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <OutputType>Exe</OutputType>
    <TargetFramework>net8.0</TargetFramework>
    <ImplicitUsings>enable</ImplicitUsings>
    <Nullable>enable</Nullable>
    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
  </PropertyGroup>
  <ItemGroup>
    <Compile Include="../../host/InputModels.cs" Link="InputModels.cs" />
    <Compile Include="../../host/MotionProcessing.cs" Link="MotionProcessing.cs" />
    <Compile Include="Program.cs" />
  </ItemGroup>
</Project>
''', encoding='utf-8')

          Path('tests/MotionSmoke/Program.cs').write_text('''using System.Numerics;
using QuestPad.Host;

static void Check(bool value, string message)
{
    if (!value) throw new InvalidOperationException(message);
}

static void Near(float actual, float expected, string message, float eps = 1e-4f)
{
    if (MathF.Abs(actual - expected) > eps)
        throw new InvalidOperationException($"{message}: expected {expected}, got {actual}");
}

static RuntimeSettingsSnapshot Settings() => new(
    OutputMode.DualShock4,
    GyroSourceMode.AngularRate,
    SmoothingLevel.Off,
    false,
    QuestViewMode.Black,
    SteeringMode.Off,
    SmoothingLevel.Off,
    240.0f,
    false,
    false);

static ControllerMotion Right(Quaternion orientation, Vector3 angular) => new(
    Active: true,
    OrientationValid: true,
    OrientationTracked: true,
    PositionValid: false,
    PositionTracked: false,
    AngularValid: true,
    Orientation: orientation,
    Position: Vector3.Zero,
    AngularVelocityLocal: angular);

var processor = new MotionProcessor();
Vector3 angular = new(0.125f, -0.25f, 0.5f);
var frame = new MotionFrame(
    1_000_000_000UL,
    default,
    Right(Quaternion.Identity, angular));

ProcessedMotion motion = processor.Process(frame, Settings());
Check(motion.GyroValid, "angular-rate gyro must remain valid");
Near(motion.GyroRadiansPerSecond.X, angular.X, "gyro X must be unchanged");
Near(motion.GyroRadiansPerSecond.Y, angular.Y, "gyro Y must be unchanged");
Near(motion.GyroRadiansPerSecond.Z, angular.Z, "gyro Z must be unchanged");
Check(motion.AccelerationValid, "identity orientation must produce valid gravity acceleration");
Near(motion.AccelerationG.X, 0.0f, "identity accel X");
Near(motion.AccelerationG.Y, 1.0f, "identity accel Y");
Near(motion.AccelerationG.Z, 0.0f, "identity accel Z");
Near(motion.AccelerationG.Length(), 1.0f, "gravity magnitude");

// Controller rotated +90 degrees around LOCAL Z: LOCAL +Y expressed in controller
// coordinates becomes +X. Gyro remains a separate channel.
Quaternion rotated = Quaternion.CreateFromAxisAngle(Vector3.UnitZ, MathF.PI / 2.0f);
var tiltedFrame = new MotionFrame(
    2_000_000_000UL,
    default,
    Right(rotated, angular));
ProcessedMotion tilted = processor.Process(tiltedFrame, Settings());
Check(tilted.AccelerationValid, "tilted orientation must keep acceleration valid");
Near(tilted.AccelerationG.X, 1.0f, "tilted accel X", 2e-4f);
Near(tilted.AccelerationG.Y, 0.0f, "tilted accel Y", 2e-4f);
Near(tilted.AccelerationG.Z, 0.0f, "tilted accel Z", 2e-4f);
Near(tilted.GyroRadiansPerSecond.X, angular.X, "tilted gyro X must remain unchanged");
Near(tilted.GyroRadiansPerSecond.Y, angular.Y, "tilted gyro Y must remain unchanged");
Near(tilted.GyroRadiansPerSecond.Z, angular.Z, "tilted gyro Z must remain unchanged");

Console.WriteLine("Motion smoke tests passed: gyro unchanged, gravity accelerometer valid.");
''', encoding='utf-8')

          # Docs are explicit that this is gravity-only compatibility, not raw MEMS.
          rep('README.md',
              '''Only the **right Touch Plus controller** is used for aiming motion.\n\n### Recommended: Angular-rate only\n''',
              '''Only the **right Touch Plus controller** is used for aiming motion.\n\nFor DS4 IMU compatibility, QuestPad also synthesizes a **gravity-only accelerometer** from the right controller orientation and writes it to the standard DS4 accel fields at 8192 counts/g. This is not raw Touch Plus acceleration and deliberately omits translational acceleration; it exists to provide the stationary ~1 g reference expected by DS4 sensor consumers such as Steam calibration. It uses orientation returned by the same OpenXR locate already used by Angular-rate mode, so it adds no second tracking query and does not enter the gyro filtering path.\n\n### Recommended: Angular-rate only\n''')

          rep('BUILD_STATUS.md',
              '''### v0.4.0 mapping candidate\n''',
              '''### v0.4.1 DS4 IMU compatibility candidate\n\nBuild-gated and awaiting Steam hardware validation:\n\n- Angular-rate mode now publishes controller orientation obtained from the **same** inverse `xrLocateSpace` result already used for controller-local angular velocity; no second pose query or positional tracking is added.\n- Windows rotates LOCAL +1 g into right-controller-local coordinates and writes the result to the standard DS4 accelerometer fields at 8192 counts/g.\n- The synthesized accelerometer is gravity-only and intentionally does not finite-difference linear velocity, avoiding an additional noise source.\n- Gyro calculation, scale and adaptive smoothing are unchanged and remain independent from the accelerometer path.\n- A permanent motion smoke test verifies both gravity orientation behavior and bit-for-bit-equivalent angular-rate vector output with smoothing Off.\n- Target hardware check: Steam Gyro Calibration should animate its accelerometer/stationary indicator and complete the drift/bias stage instead of stalling.\n\n### v0.4.0 mapping candidate\n''')

          # Remove this one-shot workflow from the resulting branch.
          Path('.github/workflows/imu-0.4.1-once.yml').unlink()

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add gravity-based DS4 accelerometer compatibility"
          git push origin HEAD:agent/session-polish
