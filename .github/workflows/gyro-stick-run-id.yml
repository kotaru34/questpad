name: gyro-sensitivity-0.4.4-candidate
on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  windows-host:
    if: "startsWith(github.event.head_commit.message, 'Run registered 0.4.4 candidate')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Mapper regression smoke test
        run: dotnet run --project tests/MapperSmoke/MapperSmoke.csproj -c Release
      - name: Motion/IMU and Xbox sensitivity regression smoke test
        run: dotnet run --project tests/MotionSmoke/MotionSmoke.csproj -c Release
      - name: Publish tray host
        run: dotnet publish host/QuestPad.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/tray
      - name: Publish console host
        run: dotnet publish host/QuestPad.Host.Console.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/console
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/tray/QuestPad.Host.exe dist/package/QuestPad.Host.exe
          Copy-Item dist/console/QuestPad.Host.Console.exe dist/package/QuestPad.Host.Console.exe
      - name: Smoke-test sensitivity default
        shell: pwsh
        run: |
          Push-Location dist/package
          & .\QuestPad.Host.Console.exe --quest-view black --help | Out-Null
          $settings = Get-Content .\QuestPad.settings.json -Raw | ConvertFrom-Json
          if ($settings.Output -ne 'Xbox360' -or $settings.GyroSource -ne 'Off') { throw 'Unexpected defaults' }
          if ([Math]::Abs([double]$settings.GyroStickSensitivity - 1.0) -gt 0.001) { throw 'GyroStickSensitivity default is not 1.0' }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: QuestPad-Host-0.4.4-test
          path: dist/package/*

  marker:
    if: "startsWith(github.event.head_commit.message, 'Run registered 0.4.4 candidate')"
    needs: windows-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
      - name: Record run result
        run: |
          printf 'run_id=%s\nvalidated_sha=%s\nresult=%s\n' '${{ github.run_id }}' '${{ github.sha }}' '${{ needs.windows-host.result }}' > .github/0.4.4-registered-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/0.4.4-registered-result.txt
          git commit -m 'Record registered 0.4.4 CI result' || exit 0
          git push origin HEAD:agent/session-polish
