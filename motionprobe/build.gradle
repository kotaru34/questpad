plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.questpad.motionprobe'
    compileSdk 32
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'dev.questpad.motionprobe'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -O2 -fno-exceptions -fno-rtti'
                targets 'questpad_motionprobe'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.58'
}
