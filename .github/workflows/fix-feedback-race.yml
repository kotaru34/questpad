name: fix-feedback-race
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-feedback-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep feedback framing state on XR thread only
        shell: python
        run: |
          from pathlib import Path
          p = Path('quest/src/main/cpp/questpad.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''            const int old = clientFd_.exchange(c);
                      if (old >= 0) close(old);
                      rumblePacked_.store(0, std::memory_order_relaxed);
                      feedbackBytes_ = 0;
          '''
          new = '''            const int old = clientFd_.exchange(c);
                      if (old >= 0) close(old);
                      rumblePacked_.store(0, std::memory_order_relaxed);
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected one accept-handoff block, got {s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = '''    uint16_t pollRumble() {
                  int fd = clientFd_.load(std::memory_order_relaxed);
                  if (fd < 0) {
          '''
          new2 = '''    uint16_t pollRumble() {
                  int fd = clientFd_.load(std::memory_order_relaxed);
                  // accept() runs on a separate thread. Keep the framing buffer entirely
                  // owned by this XR thread and reset it when the published client fd changes.
                  if (fd != feedbackFd_) {
                      feedbackFd_ = fd;
                      feedbackBytes_ = 0;
                      rumblePacked_.store(0, std::memory_order_relaxed);
                  }
                  if (fd < 0) {
          '''
          if s.count(old2) != 1:
              raise SystemExit(f'expected one pollRumble prologue, got {s.count(old2)}')
          s = s.replace(old2, new2, 1)
          old3 = '''    uint8_t feedbackBuf_[sizeof(RumblePacket)]{};
                  size_t feedbackBytes_ = 0;
                  std::thread thread_;
          '''
          new3 = '''    uint8_t feedbackBuf_[sizeof(RumblePacket)]{};
                  size_t feedbackBytes_ = 0;
                  int feedbackFd_ = -1; // XR-thread-owned connection generation marker
                  std::thread thread_;
          '''
          if s.count(old3) != 1:
              raise SystemExit(f'expected one feedback field block, got {s.count(old3)}')
          p.write_text(s.replace(old3, new3, 1), encoding='utf-8')
      - name: Commit race fix
        run: |
          git config user.name 'questpad-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add quest/src/main/cpp/questpad.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Keep rumble framing state on XR thread'
          git push
