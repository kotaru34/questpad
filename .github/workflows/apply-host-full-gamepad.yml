name: apply-host-full-gamepad
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-host-full-gamepad.py'
      - '.github/workflows/apply-host-full-gamepad.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch host mapping
        run: python3 scripts/patch-host-full-gamepad.py
      - name: Commit host update
        run: |
          git config user.name 'questpad-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add host/Program.cs
          git diff --cached --quiet && exit 0
          git commit -m 'Add ergonomic full Xbox control surface'
          git push
