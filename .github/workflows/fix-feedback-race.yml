name: fix-feedback-race
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-feedback-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep feedback framing state on XR thread only
        shell: python
        run: |
          from pathlib import Path
          p = Path('quest/src/main/cpp/questpad.cpp')
          s = p.read_text(encoding='utf-8')

          old = """            const int old = clientFd_.exchange(c);
                      if (old >= 0) close(old);
                      rumblePacked_.store(0, std::memory_order_relaxed);
                      feedbackBytes_ = 0;
          """
          # YAML de-indentation can make embedded literal indentation brittle, so use
          # direct line replacements below for the actual file text.
          old = "            const int old = clientFd_.exchange(c);\n            if (old >= 0) close(old);\n            rumblePacked_.store(0, std::memory_order_relaxed);\n            feedbackBytes_ = 0;\n"
          new = "            const int old = clientFd_.exchange(c);\n            if (old >= 0) close(old);\n            rumblePacked_.store(0, std::memory_order_relaxed);\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected one accept-handoff block, got {s.count(old)}')
          s = s.replace(old, new, 1)

          old = "    uint16_t pollRumble() {\n        int fd = clientFd_.load(std::memory_order_relaxed);\n        if (fd < 0) {\n"
          new = "    uint16_t pollRumble() {\n        int fd = clientFd_.load(std::memory_order_relaxed);\n        // accept() runs on a separate thread. Keep the framing buffer entirely\n        // owned by this XR thread and reset it when the published client fd changes.\n        if (fd != feedbackFd_) {\n            feedbackFd_ = fd;\n            feedbackBytes_ = 0;\n            rumblePacked_.store(0, std::memory_order_relaxed);\n        }\n        if (fd < 0) {\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected one pollRumble prologue, got {s.count(old)}')
          s = s.replace(old, new, 1)

          old = "    uint8_t feedbackBuf_[sizeof(RumblePacket)]{};\n    size_t feedbackBytes_ = 0;\n    std::thread thread_;\n"
          new = "    uint8_t feedbackBuf_[sizeof(RumblePacket)]{};\n    size_t feedbackBytes_ = 0;\n    int feedbackFd_ = -1; // XR-thread-owned connection generation marker\n    std::thread thread_;\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected one feedback field block, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit race fix
        run: |
          git config user.name 'questpad-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add quest/src/main/cpp/questpad.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Keep rumble framing state on XR thread'
          git push
