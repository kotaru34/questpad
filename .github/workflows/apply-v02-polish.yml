name: apply-v02-polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v02-polish.yml'
      - 'scripts/apply_v02.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.2 migration
        run: python scripts/apply_v02.py
      - name: Commit migration
        run: |
          git config user.name 'questpad-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Polish public v0.2 and improve exit gesture'
          git push
