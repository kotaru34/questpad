name: build
on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  apply-imu-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
          fetch-depth: 0
      - name: Apply strict patch
        run: python scripts/apply_imu_041.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add gravity-based DS4 accelerometer compatibility"
          git push origin HEAD:agent/session-polish
