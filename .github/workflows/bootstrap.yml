name: bootstrap-source

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.tar.gz.b64.part* > /tmp/questpad-source.tar.gz.b64
          base64 -d /tmp/questpad-source.tar.gz.b64 > /tmp/questpad-source.tar.gz
          tar -xzf /tmp/questpad-source.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'questpad-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Import QuestPad v0.1 sources'
          git push
