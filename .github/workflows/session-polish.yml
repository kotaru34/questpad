name: session-polish-once

on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Run session polish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply deterministic session polish
        run: python scripts/session_polish.py
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add bidirectional lifecycle and app polish"
          git push origin HEAD:agent/session-polish
