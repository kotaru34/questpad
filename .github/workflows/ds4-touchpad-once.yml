# one-shot trigger v2
name: ds4-touchpad-once

on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Run DS4 touchpad mapping patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
          fetch-depth: 0
      - name: Apply DS4 touchpad patch
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {s.count(old)} for {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          rep('host/InputModels.cs',
              '    public bool Guide;\n',
              '    public bool Guide;\n    public bool TouchpadClick;\n')

          rep('host/ControllerMapper.cs',
              '    private bool viewHoldActive;\n',
              '    private bool viewHoldActive;\n    private bool touchpadHoldActive;\n')
          rep('host/ControllerMapper.cs',
              '        startHoldActive = false;\n        viewHoldActive = false;\n        menuDownTicks = 0;\n',
              '        startHoldActive = false;\n        viewHoldActive = false;\n        touchpadHoldActive = false;\n        menuDownTicks = 0;\n')
          rep('host/ControllerMapper.cs',
              '        float rg)\n',
              '        float rg,\n        bool enableDs4Extras = false)\n')
          rep('host/ControllerMapper.cs',
              '        if (viewHoldActive && !rightThumb)\n            viewHoldActive = false;\n\n        bool view = viewHoldActive;\n',
              '        if (viewHoldActive && !rightThumb)\n            viewHoldActive = false;\n        if (touchpadHoldActive && !leftThumb)\n            touchpadHoldActive = false;\n\n        bool view = viewHoldActive;\n        bool touchpad = touchpadHoldActive;\n')
          rep('host/ControllerMapper.cs',
              '        bool outRightThumb = rightThumb;\n',
              '        bool outLeftThumb = leftThumb;\n        bool outRightThumb = rightThumb;\n')
          rep('host/ControllerMapper.cs',
              '                if (rightThumb)\n                {\n                    viewHoldActive = true;\n                    view = true;\n                    outRightThumb = false;\n                    menuUsed = true;\n                }\n\n                bool guideChord',
              '                if (rightThumb)\n                {\n                    viewHoldActive = true;\n                    view = true;\n                    outRightThumb = false;\n                    menuUsed = true;\n                }\n\n                if (enableDs4Extras && leftThumb)\n                {\n                    touchpadHoldActive = true;\n                    touchpad = true;\n                    outLeftThumb = false;\n                    menuUsed = true;\n                }\n\n                bool guideChord')
          rep('host/ControllerMapper.cs',
              '        if (viewHoldActive)\n        {\n            view = true;\n            outRightThumb = false;\n        }\n\n        menuWasDown = menu;\n',
              '        if (viewHoldActive)\n        {\n            view = true;\n            outRightThumb = false;\n        }\n        if (touchpadHoldActive)\n        {\n            touchpad = true;\n            outLeftThumb = false;\n        }\n\n        menuWasDown = menu;\n')
          rep('host/ControllerMapper.cs',
              '            L3 = leftThumb,\n',
              '            L3 = outLeftThumb,\n')
          rep('host/ControllerMapper.cs',
              '            Guide = guide\n',
              '            Guide = guide,\n            TouchpadClick = touchpad\n')

          rep('host/Program.cs',
              '                                p.Buttons, p.LX, p.LY, p.RX, p.RY, p.LT, p.RT, p.LG, p.RG);\n',
              '                                p.Buttons, p.LX, p.LY, p.RX, p.RY, p.LT, p.RT, p.LG, p.RG,\n                                cfg.Output == OutputMode.DualShock4);\n')

          rep('host/OutputBackends.cs',
              '        r[6] = s.Guide ? (byte)0x01 : (byte)0x00; // PS\n',
              '        r[6] = 0;\n        if (s.Guide) r[6] |= 0x01;          // PS Home\n        if (s.TouchpadClick) r[6] |= 0x02;  // Touchpad click\n')

          for project in ('host/QuestPad.Host.csproj', 'host/QuestPad.Host.Console.csproj'):
              rep(project, '<Version>0.3.8-test</Version>', '<Version>0.3.9-test</Version>')
              rep(project, '<FileVersion>0.3.8.0</FileVersion>', '<FileVersion>0.3.9.0</FileVersion>')

          rep('README.md',
              '| Menu + R3 | held Back / View |\n| Menu + LT + RT for 0.75 s | Guide |\n',
              '| Menu + R3 | held Back / View |\n| Menu + L3 (DS4 only) | Touchpad click |\n| Menu + LT + RT for 0.75 s | Guide / PS |\n')
          rep('README.md',
              'On the DS4 backend the same physical locations map naturally to Cross/Circle/Square/Triangle, L1/R1, L2/R2, Options, Share and PS. See [MAPPING.md](MAPPING.md).\n',
              'On the DS4 backend the same physical locations map naturally to Cross/Circle/Square/Triangle, L1/R1, L2/R2, Options, Share and PS. `Menu + L3` adds the DS4 touchpad click without changing Xbox-mode behavior. See [MAPPING.md](MAPPING.md).\n')
          rep('MAPPING.md',
              '| Menu + R3 | Back / View held while R3 remains held | Share held while R3 remains held |\n| Hold Menu + LT + RT for 0.75 s | Guide | PS |\n',
              '| Menu + R3 | Back / View held while R3 remains held | Share held while R3 remains held |\n| Menu + L3 | unchanged / no DS4 extra | Touchpad click held while L3 remains held |\n| Hold Menu + LT + RT for 0.75 s | Guide | PS Home |\n')
          rep('MAPPING.md',
              'Modifier actions must begin before the 0.50-second plain-Menu hold commits. Right-stick camera output is suppressed while the stick is being used as D-pad. Menu + R3 is a genuine held View/Share state rather than a short pulse.\n',
              'Modifier actions must begin before the 0.50-second plain-Menu hold commits. Right-stick camera output is suppressed while the stick is being used as D-pad. Menu + R3 is a genuine held View/Share state rather than a short pulse. In DS4 mode Menu + L3 mirrors that behavior for the physical touchpad click; Xbox mode deliberately leaves Menu + L3 unchanged.\n\n### Xbox ↔ DualShock 4 spatial equivalence\n\nQuestPad follows the conventional positional mapping: `A ↔ Cross`, `B ↔ Circle`, `X ↔ Square`, `Y ↔ Triangle`, `LB/RB ↔ L1/R1`, `LT/RT ↔ L2/R2`, `View/Back ↔ Share`, `Menu/Start ↔ Options`, and `Guide/Xbox ↔ PS Home`. D-pad directions, sticks and L3/R3 map directly. Counting the four D-pad directions separately and L2/R2 as pressable triggers, this exposes all 18 pressable DS4 controls; only touch-surface coordinates are intentionally not emulated.\n')

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/ds4-touchpad-once.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add DS4 touchpad click mapping"
          git push origin HEAD:agent/session-polish
