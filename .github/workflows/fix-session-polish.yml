name: fix-session-polish-once

on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
          fetch-depth: 0
      - name: Fix ushort control constant and remove this workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('host/Program.cs')
          s = p.read_text(encoding='utf-8')
          old = 'private const ushort ControlQuestShutdown = 1u << 9;'
          new = 'private const ushort ControlQuestShutdown = 1 << 9;'
          if s.count(old) != 1:
              raise SystemExit(f'expected one match, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-session-polish.yml').unlink()
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix host shutdown control type"
          git push origin HEAD:agent/session-polish
