name: usb-recovery-once

on:
  push:
    branches: [ agent/session-polish ]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Run hardened USB reconnect recovery patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/usb_recovery_patch2.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/usb-recovery-once.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Recover ADB transport after USB reconnect"
          git push origin HEAD:agent/session-polish
