name: apply-haptics
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-haptics.py'
      - '.github/workflows/apply-haptics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bidirectional rumble bridge
        run: python3 scripts/patch-haptics.py
      - name: Commit haptics implementation
        run: |
          git config user.name 'questpad-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add host/Program.cs quest/src/main/cpp/questpad.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Bridge Xbox rumble to Touch Plus haptics'
          git push
