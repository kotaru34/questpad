name: build
on:
  workflow_dispatch:
  push:
    branches: [ main, agent/session-polish ]

permissions:
  contents: write

jobs:
  quest-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-32" "build-tools;32.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build QuestPad and motion probe
        run: gradle :quest:assembleDebug :motionprobe:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: QuestPad-APK
          path: quest/build/outputs/apk/debug/quest-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QuestPad-Motion-Probe-APK
          path: motionprobe/build/outputs/apk/debug/motionprobe-debug.apk

  windows-host:
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/agent/session-polish' && startsWith(github.event.head_commit.message, 'Run 0.4.4 candidate'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Mapper regression smoke test
        run: dotnet run --project tests/MapperSmoke/MapperSmoke.csproj -c Release
      - name: Motion/IMU and Xbox sensitivity regression smoke test
        run: dotnet run --project tests/MotionSmoke/MotionSmoke.csproj -c Release
      - name: Publish tray host
        run: dotnet publish host/QuestPad.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/tray
      - name: Publish console host
        run: dotnet publish host/QuestPad.Host.Console.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/console
      - name: Assemble Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/tray/QuestPad.Host.exe dist/package/QuestPad.Host.exe
          Copy-Item dist/console/QuestPad.Host.Console.exe dist/package/QuestPad.Host.Console.exe
      - name: Smoke-test portable settings
        shell: pwsh
        run: |
          Push-Location dist/package
          & .\QuestPad.Host.Console.exe --quest-view black --help | Out-Null
          if (!(Test-Path .\QuestPad.settings.json)) {
            throw "QuestPad.settings.json was not created next to the executable"
          }
          $settings = Get-Content .\QuestPad.settings.json -Raw | ConvertFrom-Json
          if ($settings.Output -ne 'Xbox360' -or $settings.GyroSource -ne 'Off') {
            throw "Portable settings file did not contain the expected defaults"
          }
          if ([Math]::Abs([double]$settings.GyroStickSensitivity - 1.0) -gt 0.001) {
            throw "Xbox gyro sensitivity default must remain 1.0x"
          }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: QuestPad-Host-0.4.4-test
          path: dist/package/*

  candidate-result-marker:
    if: always() && github.ref == 'refs/heads/agent/session-polish' && startsWith(github.event.head_commit.message, 'Run 0.4.4 candidate')
    needs: windows-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-polish
      - name: Record candidate result
        run: |
          printf 'run_id=%s\nvalidated_sha=%s\nresult=%s\n' '${{ github.run_id }}' '${{ github.sha }}' '${{ needs.windows-host.result }}' > .github/0.4.4-ci-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/0.4.4-ci-result.txt
          git commit -m 'Record 0.4.4 CI result' || exit 0
          git push origin HEAD:agent/session-polish
